version: 1.3.0
pr_number: 32
new_features:
- description: Raises the minimum dbt version to 1.10.0.
- description: Adds `dbt_utils.unique_combination_of_columns` tests to staging and
    end models. If a test fails, please [open an issue](https://github.com/fivetran/dbt_twitter_organic/issues/new/choose).
under_the_hood:
- description: Removes `approval_status` and `salt` from the `stg_twitter_organic__account_history`
    model of the `stg_twitter_organic.yml` file.
- description: Adds `placement` and `tweets_send` to the `stg_twitter_organic__organic_tweet_report`
    model of the `stg_twitter_organic.yml` file.
- description: Adds `coordinates_coordinates`, `coordinates_type`, `geo_coordinates`,
    and `geo_type` to the `stg_twitter_organic__tweet` model of the `stg_twitter_organic.yml`
    file.
- description: Adds `placement` and `tweets_send` to the `organic_tweet_report` source
    table of the `src_twitter_organic.yml` file.
- description: Adds `coordinates_coordinates`, `coordinates_type`, `geo_coordinates`,
    and `geo_type` to the `tweet` source table of the `src_twitter_organic.yml` file.
date: '2026-11-18'
