version: 1.3.0
pr_number: 32
new_features:
- description: Raises the minimum dbt version to 1.10.0.
- description: Adds `dbt_utils.unique_combination_of_columns` tests to staging and
    end models. If a test fails, please [open an issue](https://github.com/fivetran/dbt_twitter_organic/issues/new/choose).
under_the_hood:
- description: Updates the staging and source yml documentation so the documented
    columns match the columns the models output.
  details:
  - Adds documentation for the `coordinates_coordinates`, `coordinates_type`, `geo_coordinates`,
    and `geo_type` fields in the `stg_twitter_organic__tweet` model.
  - Adds documentation for the `placement` and `tweets_send` fields in the `stg_twitter_organic__organic_tweet_report`
    model.
  - Removes documentation for the `approval_status` and `salt` fields, which the `stg_twitter_organic__account_history`
    model does not output.
date: '2026-11-18'
